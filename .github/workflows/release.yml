name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      # Needed to create the GitHub Release after a successful publish.
      contents: write
      # Required for npm provenance attestations, which work with a token too.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x. Keep npm current so provenance attestation
      # support matches the registry.
      - name: Use a current npm
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # Fail before the long gates rather than after them: a missing credential
      # is a five-second answer, not a two-minute one.
      - name: Check the publish credential is present
        if: github.ref_type == 'tag'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set in the npm-publish environment." >&2
            exit 1
          fi
          echo "publish credential present"

      # A manual workflow_dispatch runs every gate but stops before publishing,
      # which makes it a safe dry run.
      - name: Report publish preconditions
        run: |
          echo "ref_type=${{ github.ref_type }} ref_name=${GITHUB_REF_NAME}"
          echo "npm=$(npm --version)  node=$(node --version)"
          echo "registry=$(npm config get registry)"

      - name: Verify the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Publish
        if: github.ref_type == 'tag'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A git tag is not a GitHub Release. Publishing to npm alone left the
      # Releases page showing an older version, so create the Release here,
      # after the publish has actually succeeded.
      - name: Extract the changelog section for this version
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Literal prefix matching, not regex: "## [1.0.2]" contains brackets
          # that awk would otherwise read as a character class.
          awk -v v="$version" '
            BEGIN { target = "## [" v "]" }
            index($0, target) == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "SuperDocs CLI $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
