name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      # Needed to create the GitHub Release after a successful publish.
      contents: write
      # Required for npm trusted publishing (OIDC) and provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # `registry-url` is deliberately omitted. It writes an .npmrc containing
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}, and with no token
      # in the environment that expands to an empty credential, which npm
      # reports as ENEEDAUTH before it ever attempts OIDC.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10.x. Trusted publishing needs npm >= 11.5.1, so the
      # bundled version cannot authenticate via OIDC at all.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # A manual workflow_dispatch runs every gate but stops before publishing,
      # which makes it a safe dry run.
      - name: Report publish preconditions
        run: |
          echo "ref_type=${{ github.ref_type }} ref_name=${GITHUB_REF_NAME}"
          echo "npm=$(npm --version)  node=$(node --version)"
          echo "registry=$(npm config get registry)"

      - name: Verify the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Publish
        if: github.ref_type == 'tag'
        run: npm publish --provenance --access public --loglevel verbose

      # A git tag is not a GitHub Release. Publishing to npm alone left the
      # Releases page showing an older version, so create the Release here,
      # after the publish has actually succeeded.
      - name: Extract the changelog section for this version
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Literal prefix matching, not regex: "## [1.0.2]" contains brackets
          # that awk would otherwise read as a character class.
          awk -v v="$version" '
            BEGIN { target = "## [" v "]" }
            index($0, target) == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "SuperDocs CLI $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
