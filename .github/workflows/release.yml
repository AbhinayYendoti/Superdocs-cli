name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # This name must match the Environment field of the npm trusted publisher.
    environment: npm-publish
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # `registry-url` is deliberately omitted. It writes an .npmrc containing
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}, and with no token
      # in the environment that expands to an empty credential, which npm
      # reports as ENEEDAUTH before it ever attempts OIDC.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10.x. Trusted publishing needs npm >= 11.5.1, so the
      # bundled version cannot authenticate via OIDC at all.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # A manual workflow_dispatch runs every gate but stops short of
      # publishing, which makes it a safe dry run and a way to diagnose
      # credential problems without moving a release tag.
      - name: Report publish preconditions
        env:
          OIDC_URL_SET: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL != '' }}
        run: |
          echo "ref_type=${{ github.ref_type }} ref_name=${GITHUB_REF_NAME}"
          echo "npm=$(npm --version)  node=$(node --version)"
          echo "registry=$(npm config get registry)"
          # Presence only. These are credentials; never echo the values.
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-no}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-no}"
          for f in ./.npmrc "$HOME/.npmrc" "$NPM_CONFIG_USERCONFIG"; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              echo "--- npmrc: $f"
              sed -E 's/(_authToken[[:space:]]*=[[:space:]]*).*/\1<redacted>/' "$f"
            fi
          done

      - name: Verify the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # No NODE_AUTH_TOKEN: credentials come from the OIDC exchange configured
      # as a trusted publisher on npmjs.com. Only a tag ref may publish, so a
      # manual dispatch stops here.
      - name: Publish
        if: github.ref_type == 'tag'
        run: npm publish --provenance --access public
